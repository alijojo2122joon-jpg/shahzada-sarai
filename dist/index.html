<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>بازار معاملات سرای شهزاده کابل</title>
  <meta name="description" content="بازار دیجیتال معاملات صرافان، زرگران و تاجران سرای شهزاده کابل">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap">
  <style>
:root {
  --bg: #f3f6fb;
  --surface: #ffffff;
  --surface-2: #f7f9fd;
  --ink: #0d1b33;
  --ink-2: #44526b;
  --ink-3: #7a879c;
  --line: #e2e8f2;
  --navy: #0a1a33;
  --navy-2: #12284d;
  --blue: #1f63e0;
  --blue-2: #3b82f6;
  --blue-soft: #e8f0fe;
  --buy: #0f9960;
  --buy-soft: #e3f6ee;
  --sell: #d6334a;
  --sell-soft: #fde8eb;
  --warn: #b7791f;
  --warn-soft: #fdf3e1;
  --radius: 14px;
  --radius-sm: 10px;
  --shadow: 0 1px 2px rgba(13, 27, 51, .05), 0 8px 24px rgba(13, 27, 51, .06);
  --font: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--ink); line-height: 1.7; font-size: 15px; -webkit-font-smoothing: antialiased; }
a { color: var(--blue); text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
.num, .ltr { direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.hidden { display: none !important; }

/* ---------- header ---------- */
.topbar { background: var(--navy); color: #fff; position: sticky; top: 0; z-index: 40; box-shadow: 0 2px 12px rgba(0,0,0,.18); }
.topbar-inner { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 18px; padding: 10px 20px; }
.brand { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 800; white-space: nowrap; }
.brand-mark { width: 38px; height: 38px; border-radius: 10px; background: linear-gradient(135deg, var(--blue-2), var(--blue)); display: grid; place-items: center; box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }
.brand small { display: block; font-weight: 400; font-size: 11px; color: #9fb3d6; line-height: 1.2; }
.brand b { display: block; line-height: 1.3; font-size: 16px; }
.nav { display: flex; gap: 4px; flex: 1; }
.nav a { color: #c9d6ee; padding: 7px 12px; border-radius: 8px; font-size: 14px; white-space: nowrap; }
.nav a:hover { background: rgba(255,255,255,.07); color: #fff; }
.nav a.active { background: rgba(59,130,246,.22); color: #fff; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.bell { position: relative; background: rgba(255,255,255,.08); border: 0; color: #fff; width: 38px; height: 38px; border-radius: 10px; cursor: pointer; display: grid; place-items: center; }
.bell .dot { position: absolute; top: 4px; left: 4px; background: var(--sell); color: #fff; font-size: 10px; min-width: 17px; height: 17px; border-radius: 9px; display: grid; place-items: center; padding: 0 4px; }
.menu-btn { display: none; }
.ticker { direction: ltr; background: var(--navy-2); color: #cfdaf0; font-size: 13px; overflow: hidden; white-space: nowrap; border-top: 1px solid rgba(255,255,255,.06); }
.ticker-track { display: inline-flex; gap: 34px; padding: 6px 0; animation: tick 40s linear infinite; }
.ticker:hover .ticker-track { animation-play-state: paused; }
@keyframes tick { from { transform: translateX(0); } to { transform: translateX(-50%); } }
.ticker-track > span { direction: rtl; unicode-bidi: isolate; }
.nav .mobile-only { display: none; }
.ticker .up { color: #4ade80; } .ticker .down { color: #f87171; }

.demo-bar { background: var(--warn-soft); color: #7a5212; font-size: 13px; text-align: center; padding: 6px 12px; border-bottom: 1px solid #f1dfba; }
.demo-bar select { margin-inline-start: 6px; padding: 2px 6px; border-radius: 6px; border: 1px solid #e3c98f; background: #fff; }
.demo-bar button { background: none; border: 0; color: #7a5212; text-decoration: underline; cursor: pointer; padding: 0 4px; }

/* ---------- layout ---------- */
main { max-width: 1240px; margin: 0 auto; padding: 24px 20px 60px; min-height: 70vh; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.page-head h1 { margin: 0; font-size: 24px; font-weight: 800; }
.page-head p { margin: 2px 0 0; color: var(--ink-2); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-pad { padding: 20px; }
.card h2, .card h3 { margin: 0 0 12px; font-size: 17px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.split { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.stack > * + * { margin-top: 12px; }

/* ---------- hero ---------- */
.hero { background: radial-gradient(1200px 400px at 85% -20%, rgba(59,130,246,.35), transparent 60%), linear-gradient(160deg, var(--navy) 0%, #0f2a57 100%); color: #fff; border-radius: 20px; padding: 38px 36px; display: grid; grid-template-columns: 1.3fr 1fr; gap: 28px; align-items: center; overflow: hidden; position: relative; }
.hero h1 { font-size: 32px; line-height: 1.45; margin: 0 0 10px; font-weight: 800; }
.hero p { color: #c6d4ee; margin: 0 0 22px; max-width: 560px; }
.hero .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.hero .stat { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 14px; }
.hero .stat b { display: block; font-size: 24px; }
.hero .stat span { color: #a9bbdc; font-size: 13px; }
.book-mini { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); border-radius: 14px; padding: 6px; }
.book-mini table { width: 100%; border-collapse: collapse; font-size: 14px; }
.book-mini th { color: #9fb3d6; font-weight: 500; text-align: start; padding: 8px 10px; font-size: 12px; }
.book-mini td { padding: 8px 10px; border-top: 1px solid rgba(255,255,255,.07); }
.book-mini .b { color: #4ade80; } .book-mini .s { color: #fb7185; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; border-radius: 10px; padding: 9px 16px; font-weight: 600; cursor: pointer; transition: .15s; background: var(--surface); border-color: var(--line); color: var(--ink); white-space: nowrap; font-size: 14px; }
.btn:hover { border-color: #c8d3e6; background: var(--surface-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--blue); color: #fff; border-color: var(--blue); }
.btn-primary:hover { background: #1854c4; border-color: #1854c4; }
.btn-buy { background: var(--buy); color: #fff; border-color: var(--buy); }
.btn-buy:hover { background: #0b8150; border-color: #0b8150; }
.btn-sell { background: var(--sell); color: #fff; border-color: var(--sell); }
.btn-sell:hover { background: #b9283d; border-color: #b9283d; }
.btn-ghost { background: transparent; border-color: transparent; color: var(--blue); }
.btn-ghost:hover { background: var(--blue-soft); border-color: transparent; }
.btn-light { background: rgba(255,255,255,.1); color: #fff; border-color: rgba(255,255,255,.18); }
.btn-light:hover { background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.3); }
.btn-sm { padding: 5px 11px; font-size: 13px; border-radius: 8px; }
.btn-lg { padding: 12px 22px; font-size: 15px; }
.btn-block { width: 100%; }

/* ---------- badges ---------- */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.badge.buy { background: var(--buy-soft); color: var(--buy); border-color: transparent; }
.badge.sell { background: var(--sell-soft); color: var(--sell); border-color: transparent; }
.badge.blue { background: var(--blue-soft); color: var(--blue); border-color: transparent; }
.badge.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.badge.ok { background: var(--buy-soft); color: var(--buy); border-color: transparent; }
.badge.bad { background: var(--sell-soft); color: var(--sell); border-color: transparent; }
.verified { color: var(--blue); display: inline-flex; vertical-align: -3px; }
.asset-chip { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; }
.asset-ico { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 11px; font-weight: 800; background: var(--blue-soft); color: var(--blue); direction: ltr; }
.asset-ico.metal-XAU { background: #fdf3d6; color: #9a6b00; }
.asset-ico.metal-XAG { background: #eef1f5; color: #5b6676; }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
table.data th { text-align: start; font-weight: 600; color: var(--ink-3); font-size: 12.5px; padding: 11px 14px; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
table.data td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.data tr:last-child td { border-bottom: 0; }
table.data tbody tr:hover { background: #fafcff; }
table.data tr.clickable { cursor: pointer; }
.price { font-weight: 800; font-size: 15px; }
.empty { text-align: center; color: var(--ink-3); padding: 34px 16px; }
.empty svg { display: block; margin: 0 auto 8px; opacity: .5; }

/* ---------- forms ---------- */
.field { display: block; }
.field > span { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 5px; }
.input, select.input, textarea.input { width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 10px 12px; outline: none; transition: .15s; }
.input:focus { border-color: var(--blue-2); box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
textarea.input { min-height: 80px; resize: vertical; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 11px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; padding: 7px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--ink-2); }
.seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.seg button.on.buy { background: var(--buy); color: #fff; }
.seg button.on.sell { background: var(--sell); color: #fff; }
.side-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.side-toggle button { padding: 14px; border-radius: 12px; border: 2px solid var(--line); background: #fff; cursor: pointer; font-weight: 700; font-size: 15px; }
.side-toggle button.on.sell { border-color: var(--sell); background: var(--sell-soft); color: var(--sell); }
.side-toggle button.on.buy { border-color: var(--buy); background: var(--buy-soft); color: var(--buy); }
.total-box { background: var(--blue-soft); border-radius: 12px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
.total-box b { font-size: 20px; }
.filters { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; padding: 14px; border-bottom: 1px solid var(--line); }
.form-error { background: var(--sell-soft); color: var(--sell); padding: 10px 14px; border-radius: 10px; font-size: 14px; }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 18px; scrollbar-width: none; }
.tabs a { padding: 10px 14px; color: var(--ink-2); border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 600; font-size: 14px; }
.tabs a.on { color: var(--blue); border-color: var(--blue); }
.tabs .count { background: var(--blue-soft); color: var(--blue); border-radius: 999px; padding: 0 7px; font-size: 11px; margin-inline-start: 4px; }
.tabs .count.hot { background: var(--sell); color: #fff; }

/* ---------- stat tiles ---------- */
.tile { padding: 16px 18px; }
.tile span { color: var(--ink-3); font-size: 13px; }
.tile b { display: block; font-size: 24px; font-weight: 800; margin-top: 2px; }

/* ---------- progress ---------- */
.progress { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.progress > i { display: block; height: 100%; background: linear-gradient(90deg, var(--blue-2), var(--blue)); border-radius: 99px; }

/* ---------- rate cards ---------- */
.rate-card { padding: 16px 18px; cursor: pointer; transition: .15s; }
.rate-card:hover { border-color: #c5d4f0; transform: translateY(-1px); }
.rate-card.on { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(31,99,224,.12); }
.rate-card .rates { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 6px; }
.rate-card .rates div { background: var(--surface-2); border-radius: 9px; padding: 7px 10px; }
.rate-card .rates span { font-size: 11.5px; color: var(--ink-3); display: block; }
.chg.up { color: var(--buy); } .chg.down { color: var(--sell); }

/* ---------- requests ---------- */
.req { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: #fff; }
.req + .req { margin-top: 10px; }
.req.pending { border-inline-start: 4px solid var(--warn); }
.req.accepted { border-inline-start: 4px solid var(--blue); }
.req.completed { border-inline-start: 4px solid var(--buy); }
.req.rejected, .req.cancelled { opacity: .65; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 14px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; font-weight: 600; }

/* ---------- chat ---------- */
.chat { display: flex; flex-direction: column; gap: 8px; max-height: 360px; overflow-y: auto; padding: 4px; }
.bubble { max-width: 80%; padding: 8px 12px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); font-size: 14px; }
.bubble.mine { align-self: flex-start; background: var(--blue); color: #fff; border-color: var(--blue); }
.bubble time { display: block; font-size: 11px; opacity: .7; }

/* ---------- timeline ---------- */
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { position: relative; padding: 0 22px 14px 0; font-size: 14px; }
.timeline li::before { content: ''; position: absolute; right: 4px; top: 8px; width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.timeline li.done::before { background: var(--blue); }
.timeline li::after { content: ''; position: absolute; right: 8px; top: 20px; bottom: 0; width: 1px; background: var(--line); }
.timeline li:last-child::after { display: none; }

/* ---------- notifications panel ---------- */
.drawer { position: fixed; top: 60px; left: 20px; width: 380px; max-width: calc(100vw - 24px); max-height: 70vh; overflow-y: auto; z-index: 60; }
.notif { padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 14px; cursor: pointer; }
.notif:hover { background: var(--surface-2); }
.notif.unread { background: #f3f7ff; }
.notif time { display: block; color: var(--ink-3); font-size: 12px; }

/* ---------- modal ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(10,26,51,.45); z-index: 80; display: grid; place-items: center; padding: 16px; animation: fade .15s; }
.modal { width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal-head h3 { margin: 0; }
.x { background: none; border: 0; font-size: 22px; cursor: pointer; color: var(--ink-3); line-height: 1; }
@keyframes fade { from { opacity: 0; } }

.toast-wrap { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 99; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast { background: var(--navy); color: #fff; padding: 10px 18px; border-radius: 10px; box-shadow: var(--shadow); font-size: 14px; animation: fade .2s; }
.toast.err { background: var(--sell); }

.auth-wrap { max-width: 460px; margin: 20px auto; }
.footer { text-align: center; color: var(--ink-3); font-size: 13px; padding: 24px; border-top: 1px solid var(--line); }
.chart svg { width: 100%; height: auto; display: block; }
.notice { background: var(--blue-soft); color: #173f8a; border-radius: 12px; padding: 12px 16px; font-size: 14px; }
.notice.warn { background: var(--warn-soft); color: #7a5212; }

/* ---------- responsive ---------- */
@media (max-width: 1000px) {
  .hero { grid-template-columns: 1fr; padding: 28px 22px; }
  .split { grid-template-columns: 1fr; }
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .filters { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 860px) {
  .menu-btn { display: grid; }
  .nav { display: none; position: absolute; top: 100%; right: 0; left: 0; background: var(--navy); flex-direction: column; padding: 8px 12px 14px; box-shadow: 0 10px 20px rgba(0,0,0,.2); }
  .nav.open { display: flex; }
  .topbar-inner { position: relative; }
  .top-actions { margin-inline-start: auto; }
}
@media (max-width: 640px) {
  main { padding: 16px 12px 50px; }
  .hero h1 { font-size: 24px; }
  .hero .stats { grid-template-columns: repeat(3, 1fr); }
  .hero .stat b { font-size: 19px; }
  .g2, .g3 { grid-template-columns: 1fr; }
  .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .page-head h1 { font-size: 20px; }
  .brand small { display: none; }
  .top-actions .btn-text, .top-actions .me-btn { display: none; }
  .nav .mobile-only { display: block; }
  .topbar-inner { gap: 10px; padding: 10px 12px; }
  /* tables become cards */
  table.data.responsive thead { display: none; }
  table.data.responsive, table.data.responsive tbody, table.data.responsive tr, table.data.responsive td { display: block; width: 100%; }
  table.data.responsive tr { border-bottom: 1px solid var(--line); padding: 10px 14px; }
  table.data.responsive td { border: 0; padding: 4px 0; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
  table.data.responsive td::before { content: attr(data-l); color: var(--ink-3); font-size: 12.5px; font-weight: 500; }
  table.data.responsive td.cell-main::before { display: none; }
  table.data.responsive td.cell-act { justify-content: flex-start; padding-top: 8px; }
  table.data.responsive td.cell-act::before { display: none; }
  .drawer { left: 12px; top: 58px; }
}

</style>
</head>
<body>
  <div id="app"><div style="padding:80px;text-align:center;color:#7a879c">در حال بارگذاری…</div></div>
  <script>
/*
 * Shahzada Sarai — core trading engine (shared by the Node server and the browser demo).
 * Pure, synchronous logic over a plain JSON state object.
 * Every mutation goes through dispatch(), which validates, applies, notifies and audits.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.SaraiEngine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const ACTIVITIES = { saraf: 'صراف', zargar: 'زرگر', tajer: 'تاجر', other: 'سایر معامله‌گران' };
  const ORDER_STATUS = { active: 'فعال', filled: 'تکمیل ظرفیت', closed: 'بسته‌شده', cancelled: 'لغوشده', expired: 'منقضی' };
  const DEAL_STATUS = { pending: 'در انتظار پاسخ', accepted: 'در حال انجام', rejected: 'ردشده', cancelled: 'لغوشده', completed: 'تکمیل‌شده' };
  const USER_STATUS = { pending: 'تأییدنشده', approved: 'تأییدشده', blocked: 'مسدود' };

  class EngineError extends Error {
    constructor(message, code) { super(message); this.code = code || 'bad_request'; }
  }
  const fail = (msg, code) => { throw new EngineError(msg, code); };

  /* ---------- helpers ---------- */
  function emptyState() {
    return {
      version: 0,
      seq: {},
      users: [], assets: [], orders: [], deals: [], messages: [],
      notifications: [], rates: [], rateHistory: [], reports: [], audit: [],
    };
  }
  function nextId(state, kind) {
    state.seq[kind] = (state.seq[kind] || 0) + 1;
    return state.seq[kind];
  }
  const round = (n, d = 6) => Math.round(Number(n) * 10 ** d) / 10 ** d;
  const num = (v, label) => {
    const n = Number(String(v).replace(/,/g, '').trim());
    if (!isFinite(n) || n <= 0) fail(`${label} باید عدد مثبت باشد`);
    return round(n);
  };
  const str = (v, label, { required = true, max = 200 } = {}) => {
    const s = (v == null ? '' : String(v)).trim();
    if (required && !s) fail(`${label} الزامی است`);
    if (s.length > max) fail(`${label} بیش از حد طولانی است`);
    return s;
  };
  const normPhone = (p) => String(p || '').replace(/[^\d+]/g, '');
  const toLatinDigits = (s) => String(s || '')
    .replace(/[۰-۹]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));

  // Small non-cryptographic hash used only to chain audit entries (tamper-evidence).
  function chainHash(input) {
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0; i < input.length; i++) {
      const ch = input.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0');
  }

  const byId = (arr, id) => arr.find((x) => x.id === Number(id));
  const userById = (s, id) => byId(s.users, id);
  const assetById = (s, id) => byId(s.assets, id);

  function audit(state, now, actorId, type, ref, detail) {
    const prev = state.audit.length ? state.audit[state.audit.length - 1].hash : 'genesis';
    const entry = { id: nextId(state, 'audit'), at: now, actorId: actorId || null, type, ref: ref || null, detail: detail || '' };
    entry.hash = chainHash(prev + JSON.stringify(entry));
    state.audit.push(entry);
  }
  function notify(state, now, userId, text, link) {
    state.notifications.push({ id: nextId(state, 'notif'), userId, text, link: link || '', read: false, at: now });
  }
  function notifyAdmins(state, now, text, link) {
    state.users.filter((u) => u.role === 'admin' && u.status === 'approved').forEach((a) => notify(state, now, a.id, text, link));
  }
  const displayName = (u) => (u ? (u.company || u.name) : '—');

  function fmtAmount(order, asset, amount) {
    return `${Number(amount).toLocaleString('en-US')} ${order.unit || (asset && asset.unit) || ''}`.trim();
  }

  /* ---------- expiry sweep ---------- */
  function sweep(state, now) {
    let changed = false;
    for (const o of state.orders) {
      if (o.status === 'active' && o.expiresAt && o.expiresAt <= now) {
        o.status = 'expired';
        changed = true;
        for (const d of state.deals) {
          if (d.orderId === o.id && d.status === 'pending') {
            d.status = 'rejected'; d.updatedAt = now; d.reason = 'سفارش منقضی شد';
            notify(state, now, d.requesterId, `سفارش #${o.id} منقضی شد و درخواست شما بسته شد.`, '#dashboard-sent');
          }
        }
        notify(state, now, o.userId, `سفارش #${o.id} شما منقضی شد.`, '#dashboard-orders');
        audit(state, now, null, 'order.expired', `order:${o.id}`, '');
      }
    }
    return changed;
  }

  /* ---------- auth (password hashing is injected by the host) ---------- */
  function register(state, input, { now, hashPassword }) {
    const name = str(input.name, 'نام و نام خانوادگی', { max: 80 });
    const phone = normPhone(toLatinDigits(input.phone));
    if (phone.length < 9) fail('شماره تماس معتبر نیست');
    const whatsapp = normPhone(toLatinDigits(input.whatsapp)) || phone;
    const company = str(input.company, 'نام صرافی یا شرکت', { max: 80 });
    const activity = ACTIVITIES[input.activity] ? input.activity : fail('نوع فعالیت را انتخاب کنید');
    const password = String(input.password || '');
    if (password.length < 6) fail('رمز عبور باید حداقل ۶ حرف باشد');
    if (state.users.some((u) => u.phone === phone)) fail('این شماره قبلاً ثبت شده است', 'conflict');
    const isFirst = state.users.length === 0;
    const user = {
      id: nextId(state, 'user'), name, phone, whatsapp, company, activity,
      role: isFirst ? 'admin' : 'member', status: isFirst ? 'approved' : 'pending',
      showContact: true, bio: '', createdAt: now, passHash: hashPassword(password),
    };
    state.users.push(user);
    audit(state, now, user.id, 'user.registered', `user:${user.id}`, company);
    if (!isFirst) notifyAdmins(state, now, `عضو جدید «${company}» منتظر تأیید است.`, '#admin-users');
    state.version++;
    return user;
  }
  function login(state, input, { verifyPassword }) {
    const phone = normPhone(toLatinDigits(input.phone));
    const user = state.users.find((u) => u.phone === phone);
    if (!user || !verifyPassword(String(input.password || ''), user.passHash)) fail('شماره یا رمز عبور اشتباه است', 'unauthorized');
    if (user.status === 'blocked') fail('حساب شما مسدود شده است. با مدیر سیستم تماس بگیرید.', 'forbidden');
    return user;
  }

  /* ---------- permission guards ---------- */
  function requireUser(state, actorId) {
    const u = userById(state, actorId);
    if (!u) fail('ابتدا وارد حساب شوید', 'unauthorized');
    if (u.status === 'blocked') fail('حساب شما مسدود است', 'forbidden');
    return u;
  }
  function requireApproved(state, actorId) {
    const u = requireUser(state, actorId);
    if (u.status !== 'approved') fail('حساب شما هنوز توسط مدیر تأیید نشده است', 'forbidden');
    return u;
  }
  function requireAdmin(state, actorId) {
    const u = requireApproved(state, actorId);
    if (u.role !== 'admin') fail('این بخش فقط برای مدیر است', 'forbidden');
    return u;
  }

  /* ---------- actions ---------- */
  const actions = {
    'profile.update'(s, me, p, now) {
      const u = requireUser(s, me);
      if (p.name !== undefined) u.name = str(p.name, 'نام', { max: 80 });
      if (p.company !== undefined) u.company = str(p.company, 'نام صرافی', { max: 80 });
      if (p.whatsapp !== undefined) u.whatsapp = normPhone(toLatinDigits(p.whatsapp)) || u.phone;
      if (p.activity !== undefined) { if (!ACTIVITIES[p.activity]) fail('نوع فعالیت نامعتبر'); u.activity = p.activity; }
      if (p.bio !== undefined) u.bio = str(p.bio, 'توضیحات', { required: false, max: 400 });
      if (p.showContact !== undefined) u.showContact = !!p.showContact;
      audit(s, now, me, 'user.profile', `user:${u.id}`, '');
      return { ok: true };
    },

    'order.create'(s, me, p, now) {
      const u = requireApproved(s, me);
      const asset = assetById(s, p.assetId);
      if (!asset || !asset.active) fail('دارایی انتخاب‌شده معتبر نیست');
      const side = p.side === 'buy' ? 'buy' : p.side === 'sell' ? 'sell' : fail('نوع معامله را انتخاب کنید');
      const amount = num(p.amount, 'مقدار');
      const price = num(p.price, 'نرخ');
      const unit = str(p.unit || asset.unit, 'واحد', { max: 20 });
      const priceCurrency = str(p.priceCurrency || asset.priceCurrency, 'واحد قیمت', { max: 20 });
      const minAmount = p.minAmount ? num(p.minAmount, 'حداقل مقدار') : 0;
      if (minAmount > amount) fail('حداقل مقدار نمی‌تواند از کل مقدار بیشتر باشد');
      const hours = Number(p.validHours || 0);
      const expiresAt = hours > 0 ? now + hours * 3600e3 : null;
      const dup = s.orders.find((o) => o.userId === me && o.status === 'active' && o.assetId === asset.id &&
        o.side === side && o.price === price && o.amount === amount && now - o.createdAt < 10 * 60e3);
      if (dup) fail(`سفارش مشابه (#${dup.id}) چند دقیقه پیش ثبت شده است`, 'conflict');
      const order = {
        id: nextId(s, 'order'), userId: me, side, assetId: asset.id, amount, remaining: amount, minAmount,
        price, priceCurrency, unit, note: str(p.note, 'توضیحات', { required: false, max: 300 }),
        status: 'active', createdAt: now, expiresAt, updatedAt: now,
      };
      s.orders.push(order);
      audit(s, now, me, 'order.created', `order:${order.id}`,
        `${side} ${amount} ${unit} ${asset.code} @ ${price} ${priceCurrency}`);
      return { orderId: order.id, _name: displayName(u) };
    },

    'order.cancel'(s, me, p, now) {
      const u = requireUser(s, me);
      const o = byId(s.orders, p.orderId) || fail('سفارش پیدا نشد', 'not_found');
      if (o.userId !== me && u.role !== 'admin') fail('اجازه ندارید', 'forbidden');
      if (!['active', 'filled'].includes(o.status)) fail('این سفارش قابل بستن نیست');
      const hasOpen = s.deals.some((d) => d.orderId === o.id && d.status === 'accepted');
      o.status = hasOpen ? 'closed' : (o.amount === o.remaining ? 'cancelled' : 'closed');
      o.updatedAt = now;
      for (const d of s.deals) {
        if (d.orderId === o.id && d.status === 'pending') {
          d.status = 'rejected'; d.updatedAt = now; d.reason = 'سفارش بسته شد';
          notify(s, now, d.requesterId, `سفارش #${o.id} بسته شد و درخواست شما رد شد.`, '#dashboard-sent');
        }
      }
      if (o.userId !== me) notify(s, now, o.userId, `سفارش #${o.id} شما توسط مدیر بسته شد.`, '#dashboard-orders');
      audit(s, now, me, 'order.closed', `order:${o.id}`, `remaining ${o.remaining}`);
      return { ok: true };
    },

    'deal.request'(s, me, p, now) {
      const u = requireApproved(s, me);
      const o = byId(s.orders, p.orderId) || fail('سفارش پیدا نشد', 'not_found');
      if (o.status !== 'active') fail('این سفارش دیگر فعال نیست');
      if (o.userId === me) fail('نمی‌توانید به سفارش خودتان درخواست بدهید');
      const amount = num(p.amount, 'مقدار درخواستی');
      if (amount > o.remaining) fail(`مقدار درخواستی از مقدار باقی‌مانده (${o.remaining}) بیشتر است`);
      if (o.minAmount && amount < o.minAmount && amount !== o.remaining) fail(`حداقل مقدار برای این سفارش ${o.minAmount} است`);
      if (s.deals.some((d) => d.orderId === o.id && d.requesterId === me && d.status === 'pending'))
        fail('شما برای این سفارش یک درخواست در انتظار دارید', 'conflict');
      const asset = assetById(s, o.assetId);
      const deal = {
        id: nextId(s, 'deal'), orderId: o.id, ownerId: o.userId, requesterId: me, amount, acceptedAmount: 0,
        price: o.price, note: str(p.note, 'پیام', { required: false, max: 300 }),
        status: 'pending', ownerDone: false, requesterDone: false, createdAt: now, updatedAt: now,
      };
      s.deals.push(deal);
      const verb = o.side === 'sell' ? 'خرید' : 'فروش';
      notify(s, now, o.userId, `«${displayName(u)}» درخواست ${verb} ${fmtAmount(o, asset, amount)} ${asset.code} از سفارش #${o.id} فرستاد.`, '#dashboard-received');
      audit(s, now, me, 'deal.requested', `deal:${deal.id}`, `order ${o.id} amount ${amount}`);
      return { dealId: deal.id };
    },

    'deal.accept'(s, me, p, now) {
      requireApproved(s, me);
      const d = byId(s.deals, p.dealId) || fail('درخواست پیدا نشد', 'not_found');
      const o = byId(s.orders, d.orderId);
      if (d.ownerId !== me) fail('فقط صاحب سفارش می‌تواند تأیید کند', 'forbidden');
      if (d.status !== 'pending') fail('این درخواست قبلاً پاسخ داده شده است');
      if (o.status !== 'active') fail('سفارش فعال نیست');
      const amount = p.amount ? num(p.amount, 'مقدار تأیید') : d.amount;
      if (amount > d.amount) fail('مقدار تأیید نمی‌تواند از مقدار درخواست بیشتر باشد');
      // Core rule: accepted total can never exceed what is available.
      if (amount > o.remaining) fail(`فقط ${o.remaining} باقی مانده است؛ نمی‌توان ${amount} را تأیید کرد`, 'conflict');
      o.remaining = round(o.remaining - amount);
      o.updatedAt = now;
      d.acceptedAmount = amount; d.status = 'accepted'; d.updatedAt = now; d.acceptedAt = now;
      const asset = assetById(s, o.assetId);
      const partial = amount < d.amount ? ` (به‌صورت جزئی از ${d.amount})` : '';
      notify(s, now, d.requesterId, `درخواست شما برای ${fmtAmount(o, asset, amount)} ${asset.code}${partial} تأیید شد. اطلاعات تماس طرف مقابل در دسترس است.`, `#deal-${d.id}`);
      if (o.remaining <= 0) {
        o.status = 'filled';
        for (const x of s.deals) {
          if (x.orderId === o.id && x.status === 'pending') {
            x.status = 'rejected'; x.updatedAt = now; x.reason = 'ظرفیت سفارش تکمیل شد';
            notify(s, now, x.requesterId, `ظرفیت سفارش #${o.id} تکمیل شد و درخواست شما بسته شد.`, '#dashboard-sent');
          }
        }
      }
      audit(s, now, me, 'deal.accepted', `deal:${d.id}`, `amount ${amount}, order ${o.id} remaining ${o.remaining}`);
      return { ok: true, remaining: o.remaining };
    },

    'deal.reject'(s, me, p, now) {
      requireUser(s, me);
      const d = byId(s.deals, p.dealId) || fail('درخواست پیدا نشد', 'not_found');
      if (d.ownerId !== me) fail('اجازه ندارید', 'forbidden');
      if (d.status !== 'pending') fail('این درخواست قبلاً پاسخ داده شده است');
      d.status = 'rejected'; d.updatedAt = now; d.reason = str(p.reason, 'دلیل', { required: false, max: 200 });
      notify(s, now, d.requesterId, `درخواست شما برای سفارش #${d.orderId} رد شد.`, '#dashboard-sent');
      audit(s, now, me, 'deal.rejected', `deal:${d.id}`, d.reason);
      return { ok: true };
    },

    'deal.withdraw'(s, me, p, now) {
      requireUser(s, me);
      const d = byId(s.deals, p.dealId) || fail('درخواست پیدا نشد', 'not_found');
      if (d.requesterId !== me) fail('اجازه ندارید', 'forbidden');
      if (d.status !== 'pending') fail('فقط درخواست در انتظار قابل پس‌گرفتن است');
      d.status = 'cancelled'; d.updatedAt = now;
      notify(s, now, d.ownerId, `یک درخواست برای سفارش #${d.orderId} پس گرفته شد.`, '#dashboard-received');
      audit(s, now, me, 'deal.withdrawn', `deal:${d.id}`, '');
      return { ok: true };
    },

    'deal.cancel'(s, me, p, now) {
      const u = requireUser(s, me);
      const d = byId(s.deals, p.dealId) || fail('معامله پیدا نشد', 'not_found');
      if (![d.ownerId, d.requesterId].includes(me) && u.role !== 'admin') fail('اجازه ندارید', 'forbidden');
      if (d.status !== 'accepted') fail('فقط معامله در حال انجام قابل لغو است');
      const o = byId(s.orders, d.orderId);
      d.status = 'cancelled'; d.updatedAt = now; d.reason = str(p.reason, 'دلیل', { required: false, max: 200 });
      // Return the reserved quantity to the order.
      o.remaining = round(o.remaining + d.acceptedAmount);
      if (o.status === 'filled') o.status = (o.expiresAt && o.expiresAt <= now) ? 'expired' : 'active';
      o.updatedAt = now;
      const other = me === d.ownerId ? d.requesterId : d.ownerId;
      notify(s, now, other, `معامله #${d.id} لغو شد${d.reason ? ': ' + d.reason : ''}.`, `#deal-${d.id}`);
      if (u.role === 'admin' && other !== d.ownerId && me !== d.ownerId) notify(s, now, d.ownerId, `معامله #${d.id} توسط مدیر لغو شد.`, `#deal-${d.id}`);
      audit(s, now, me, 'deal.cancelled', `deal:${d.id}`, `returned ${d.acceptedAmount} to order ${o.id}`);
      return { ok: true };
    },

    'deal.complete'(s, me, p, now) {
      requireUser(s, me);
      const d = byId(s.deals, p.dealId) || fail('معامله پیدا نشد', 'not_found');
      if (![d.ownerId, d.requesterId].includes(me)) fail('اجازه ندارید', 'forbidden');
      if (d.status !== 'accepted') fail('این معامله در حال انجام نیست');
      if (me === d.ownerId) d.ownerDone = true; else d.requesterDone = true;
      d.updatedAt = now;
      const other = me === d.ownerId ? d.requesterId : d.ownerId;
      if (d.ownerDone && d.requesterDone) {
        d.status = 'completed'; d.completedAt = now;
        notify(s, now, other, `معامله #${d.id} توسط هر دو طرف نهایی شد.`, `#deal-${d.id}`);
        notify(s, now, me, `معامله #${d.id} نهایی شد.`, `#deal-${d.id}`);
      } else {
        notify(s, now, other, `طرف مقابل معامله #${d.id} را تکمیل‌شده اعلام کرد. لطفاً شما هم تأیید کنید.`, `#deal-${d.id}`);
      }
      audit(s, now, me, 'deal.confirmed', `deal:${d.id}`, d.status);
      return { ok: true, status: d.status };
    },

    'message.send'(s, me, p, now) {
      requireApproved(s, me);
      const d = byId(s.deals, p.dealId) || fail('معامله پیدا نشد', 'not_found');
      if (![d.ownerId, d.requesterId].includes(me)) fail('اجازه ندارید', 'forbidden');
      if (!['accepted', 'completed', 'pending'].includes(d.status)) fail('گفتگوی این معامله بسته است');
      const text = str(p.text, 'پیام', { max: 1000 });
      s.messages.push({ id: nextId(s, 'msg'), dealId: d.id, userId: me, text, at: now });
      const other = me === d.ownerId ? d.requesterId : d.ownerId;
      notify(s, now, other, `پیام جدید در معامله #${d.id}`, `#deal-${d.id}`);
      return { ok: true };
    },

    'notifications.read'(s, me, p) {
      requireUser(s, me);
      s.notifications.forEach((n) => { if (n.userId === me && (!p.id || n.id === Number(p.id))) n.read = true; });
      return { ok: true, _quiet: true };
    },

    'report.create'(s, me, p, now) {
      requireApproved(s, me);
      const target = userById(s, p.userId) || fail('کاربر پیدا نشد', 'not_found');
      if (target.id === me) fail('نمی‌توانید خودتان را گزارش دهید');
      const r = { id: nextId(s, 'report'), reporterId: me, userId: target.id, dealId: p.dealId ? Number(p.dealId) : null,
        reason: str(p.reason, 'شرح گزارش', { max: 500 }), status: 'open', createdAt: now };
      s.reports.push(r);
      notifyAdmins(s, now, `گزارش جدید درباره «${displayName(target)}»`, '#admin-reports');
      audit(s, now, me, 'report.created', `user:${target.id}`, r.reason);
      return { ok: true };
    },

    /* ----- admin ----- */
    'admin.user.setStatus'(s, me, p, now) {
      requireAdmin(s, me);
      const u = userById(s, p.userId) || fail('کاربر پیدا نشد', 'not_found');
      if (!USER_STATUS[p.status]) fail('وضعیت نامعتبر');
      if (u.id === me && p.status !== 'approved') fail('نمی‌توانید حساب خودتان را مسدود کنید');
      u.status = p.status;
      if (p.status === 'blocked') {
        for (const o of s.orders) if (o.userId === u.id && o.status === 'active') { o.status = 'closed'; o.updatedAt = now; }
        for (const d of s.deals) if (d.requesterId === u.id && d.status === 'pending') { d.status = 'cancelled'; d.updatedAt = now; }
      }
      notify(s, now, u.id, p.status === 'approved' ? 'حساب شما تأیید شد. اکنون می‌توانید سفارش ثبت کنید.' :
        p.status === 'blocked' ? 'حساب شما مسدود شد.' : 'وضعیت حساب شما به «تأییدنشده» تغییر کرد.', '#profile');
      audit(s, now, me, 'admin.user.status', `user:${u.id}`, p.status);
      return { ok: true };
    },
    'admin.user.setRole'(s, me, p, now) {
      requireAdmin(s, me);
      const u = userById(s, p.userId) || fail('کاربر پیدا نشد', 'not_found');
      if (!['admin', 'member'].includes(p.role)) fail('نقش نامعتبر');
      if (u.id === me && p.role !== 'admin') fail('نمی‌توانید نقش مدیر را از خودتان بگیرید');
      u.role = p.role;
      audit(s, now, me, 'admin.user.role', `user:${u.id}`, p.role);
      return { ok: true };
    },
    'admin.asset.save'(s, me, p, now) {
      requireAdmin(s, me);
      const code = str(p.code, 'کد دارایی', { max: 12 }).toUpperCase();
      const data = { code, name: str(p.name, 'نام دارایی', { max: 40 }), unit: str(p.unit, 'واحد مقدار', { max: 12 }),
        priceCurrency: str(p.priceCurrency, 'واحد قیمت', { max: 12 }), kind: p.kind === 'metal' ? 'metal' : 'currency' };
      let a = p.id ? assetById(s, p.id) : null;
      if (s.assets.some((x) => x.code === code && (!a || x.id !== a.id))) fail('این کد قبلاً ثبت شده است', 'conflict');
      if (a) Object.assign(a, data);
      else { a = { id: nextId(s, 'asset'), ...data, active: true }; s.assets.push(a); }
      audit(s, now, me, 'admin.asset.save', `asset:${a.id}`, code);
      return { assetId: a.id };
    },
    'admin.asset.toggle'(s, me, p, now) {
      requireAdmin(s, me);
      const a = assetById(s, p.assetId) || fail('دارایی پیدا نشد', 'not_found');
      a.active = !a.active;
      audit(s, now, me, 'admin.asset.toggle', `asset:${a.id}`, String(a.active));
      return { ok: true };
    },
    'admin.rate.set'(s, me, p, now) {
      requireAdmin(s, me);

      members: state.users.filter((u) => u.status === 'approved').length,
      activeOrders: state.orders.filter((o) => o.status === 'active').length,
      completedDeals: state.deals.filter((d) => d.status === 'completed').length,

    for (const [code, [b, sl]] of Object.entries(base)) {

      state.orders.push(o); return o;

    const o1 = ord(u1, 'sell', 'USD', 40000, 65.30, 'تحویل نقد در سرای شهزاده', 3);

    state.deals.push(d1, d2, d3);
    o1.remaining = 25000;
    state.messages.push({ id: nextId(state, 'msg'), dealId: d1.id, userId: u2.id, text: 'سلام، ساعت ۲ در دفتر شما هستم.', at: now - 0.8 * H });
    state.messages.push({ id: nextId(state, 'msg'), dealId: d1.id, userId: u1.id, text: 'قبول، منتظرتان هستم.', at: now - 0.7 * H });
    notify(state, now - 0.5 * H, u1.id, '«زرگری رحیمی» درخواست خرید 10,000 USD از سفارش #1 فرستاد.', '#dashboard-received');
    notify(state, now - 0.3 * H, u1.id, '«تجارتی احمدی» درخواست خرید 20,000 USD از سفارش #1 فرستاد.', '#dashboard-received');
    notify(state, now - H, u2.id, 'درخواست شما برای 15,000 USD تأیید شد.', `#deal-${d1.id}`);
    audit(state, now, null, 'system.seed', null, 'demo data');
    state.version++;
    return state;
  }

  return {
    ACTIVITIES, ORDER_STATUS, DEAL_STATUS, USER_STATUS, EngineError,
    emptyState, register, login, dispatch, buildView, seed, verifyAudit, sweep, actions: Object.keys(actions),
  };
});
