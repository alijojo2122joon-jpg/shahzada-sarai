<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>بازار معاملات سرای شهزاده کابل</title>
  <meta name="description" content="بازار دیجیتال معاملات صرافان، زرگران و تاجران سرای شهزاده کابل">
  <meta name="theme-color" content="#1b1e25">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="سرای شهزاده">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap">
  <style>
/* =====================================================================
   Shahzada Sarai — Soft UI (neumorphism) design system
   Dark is the default theme; [data-theme="light"] switches to light.
   Motion uses one "flow" curve everywhere.
   ===================================================================== */
:root {
  --flow: cubic-bezier(.22, 1, .36, 1);
  --flow-soft: cubic-bezier(.45, 0, .2, 1);
  --t-fast: .25s;
  --t: .45s;
  --t-slow: .8s;

  --radius: 26px;
  --radius-md: 20px;
  --radius-sm: 14px;
  --pill: 999px;

  --blue: #3b82f6;
  --blue-2: #60a5fa;
  --cyan: #22d3ee;
  --violet: #8b7cf6;
  --buy: #2fd389;
  --sell: #ff6b7a;
  --warn: #f5b84b;
  --gold: #f2c14e;
  --font: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
}

/* ---------- dark (default) ---------- */
:root, [data-theme="dark"] {
  --bg: #1b1e25;
  --bg-2: #20242c;
  --surface: #1f232b;
  --raised: linear-gradient(145deg, #232832, #1b1f26);
  --ink: #e9eef7;
  --ink-2: #aab4c5;
  --ink-3: #6f7a8d;
  --line: rgba(255, 255, 255, .06);
  --sh-dark: rgba(0, 0, 0, .55);
  --sh-light: rgba(255, 255, 255, .045);
  --out: 9px 9px 22px var(--sh-dark), -7px -7px 18px var(--sh-light);
  --out-sm: 5px 5px 12px var(--sh-dark), -4px -4px 10px var(--sh-light);
  --in: inset 5px 5px 12px var(--sh-dark), inset -4px -4px 10px var(--sh-light);
  --in-sm: inset 3px 3px 7px var(--sh-dark), inset -3px -3px 7px var(--sh-light);
  --chip-bg: #252a34;
  --glass: rgba(32, 36, 44, .72);
  --pill-active-bg: linear-gradient(145deg, #eef2f8, #d8dee8);
  --pill-active-ink: #141821;
  --blue-soft: rgba(59, 130, 246, .14);
  --buy-soft: rgba(47, 211, 137, .13);
  --sell-soft: rgba(255, 107, 122, .13);
  --warn-soft: rgba(245, 184, 75, .14);
  --glow-strength: .55;
  color-scheme: dark;
}
/* ---------- light ---------- */
[data-theme="light"] {
  --bg: #e7ebf1;
  --bg-2: #eef1f6;
  --surface: #e9edf3;
  --raised: linear-gradient(145deg, #f1f4f9, #dfe4ec);
  --ink: #1d2433;
  --ink-2: #4b566b;
  --ink-3: #8691a5;
  --line: rgba(20, 30, 50, .07);
  --sh-dark: rgba(163, 177, 198, .75);
  --sh-light: rgba(255, 255, 255, .95);
  --chip-bg: #e3e8ef;
  --glass: rgba(240, 243, 248, .72);
  --pill-active-bg: linear-gradient(145deg, #1f2533, #141924);
  --pill-active-ink: #fff;
  --blue-soft: rgba(59, 130, 246, .12);
  --buy-soft: rgba(16, 170, 100, .12);
  --sell-soft: rgba(230, 60, 80, .1);
  --warn-soft: rgba(210, 140, 20, .12);
  --buy: #12a868;
  --sell: #e5485c;
  --warn: #c98a12;
  --glow-strength: .4;
  color-scheme: light;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  font-family: var(--font); background: var(--bg); color: var(--ink); line-height: 1.75; font-size: 15px;
  -webkit-font-smoothing: antialiased; transition: background var(--t) var(--flow-soft), color var(--t) var(--flow-soft);
  background-image: radial-gradient(900px 500px at 85% -10%, rgba(59,130,246,.10), transparent 60%), radial-gradient(700px 500px at 0% 110%, rgba(139,124,246,.07), transparent 60%);
  background-attachment: fixed; min-height: 100vh;
}
a { color: var(--blue-2); text-decoration: none; transition: color var(--t-fast) var(--flow); }
[data-theme="light"] a:not(.btn) { color: var(--blue); }
button, input, select, textarea { font: inherit; color: inherit; }
::selection { background: rgba(59,130,246,.35); }
.num, .ltr { direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.hidden { display: none !important; }

/* ---------- motion primitives ---------- */
@keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } }
@keyframes breathe { 0%, 100% { opacity: calc(var(--glow-strength) * .6); transform: translateX(-50%) scaleX(.85); } 50% { opacity: var(--glow-strength); transform: translateX(-50%) scaleX(1.05); } }
@keyframes drift { 0% { transform: translate(-50%, 0) rotate(0deg); } 100% { transform: translate(-50%, 0) rotate(360deg); } }
@keyframes sweep { 0% { transform: translateX(-120%) skewX(-18deg); } 100% { transform: translateX(260%) skewX(-18deg); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(47,211,137,.55); } 60% { box-shadow: 0 0 0 9px rgba(47,211,137,0); } }
@keyframes arc { from { stroke-dashoffset: var(--len); } }
@keyframes tick { from { transform: translateX(0); } to { transform: translateX(-50%); } }
@keyframes pop { 0% { transform: scale(.94); opacity: 0; } 100% { transform: none; opacity: 1; } }

main.enter > * { animation: rise var(--t-slow) var(--flow) both; }
main.enter > *:nth-child(2) { animation-delay: .06s; }
main.enter > *:nth-child(3) { animation-delay: .12s; }
main.enter > *:nth-child(4) { animation-delay: .18s; }
main.enter > *:nth-child(5) { animation-delay: .24s; }
main.enter > *:nth-child(n+6) { animation-delay: .3s; }
main.enter .grid > * { animation: rise var(--t-slow) var(--flow) both; }
main.enter .grid > *:nth-child(2) { animation-delay: .08s; }
main.enter .grid > *:nth-child(3) { animation-delay: .14s; }
main.enter .grid > *:nth-child(4) { animation-delay: .2s; }
main.enter .grid > *:nth-child(n+5) { animation-delay: .26s; }
main.enter table.data tbody tr { animation: rise var(--t) var(--flow) both; }
main.enter table.data tbody tr:nth-child(2) { animation-delay: .04s; }
main.enter table.data tbody tr:nth-child(3) { animation-delay: .08s; }
main.enter table.data tbody tr:nth-child(4) { animation-delay: .12s; }
main.enter table.data tbody tr:nth-child(5) { animation-delay: .16s; }
main.enter table.data tbody tr:nth-child(n+6) { animation-delay: .2s; }

/* Light sweep: a soft sheen that glides across raised elements */
.sheen { position: relative; overflow: hidden; isolation: isolate; }
.sheen::before {
  content: ''; position: absolute; inset: 0 auto 0 0; width: 45%; pointer-events: none; z-index: 1;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent);
  transform: translateX(-120%) skewX(-18deg);
}
.sheen:hover::before { animation: sweep 1.1s var(--flow-soft); }
[data-theme="light"] .sheen::before { background: linear-gradient(90deg, transparent, rgba(255,255,255,.75), transparent); }

/* Under-glow: a breathing light pool beneath a shape */
.glow { position: relative; isolation: isolate; }
.glow::after {
  content: ''; position: absolute; left: 50%; bottom: -16px; width: 74%; height: 34px; z-index: -1; pointer-events: none;
  background: radial-gradient(closest-side, var(--glow-c, var(--blue)), transparent); filter: blur(14px);
  animation: breathe 4.5s var(--flow-soft) infinite;
}
.glow.g-buy { --glow-c: var(--buy); } .glow.g-sell { --glow-c: var(--sell); } .glow.g-warm { --glow-c: #ff9a3c; } .glow.g-violet { --glow-c: var(--violet); }

/* ---------- header (glass) ---------- */
.topbar { position: sticky; top: 0; z-index: 40; background: var(--glass); backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3); border-bottom: 1px solid var(--line); }
.topbar-inner { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 18px; padding: 12px 20px; }
.brand { display: flex; align-items: center; gap: 12px; color: var(--ink) !important; font-weight: 800; white-space: nowrap; }
.brand-mark { width: 46px; height: 46px; border-radius: 50%; background: var(--raised); box-shadow: var(--out-sm); display: grid; place-items: center; position: relative; }
.brand-mark svg { stroke: var(--blue-2); filter: drop-shadow(0 0 6px rgba(96,165,250,.6)); }
.brand small { display: block; font-weight: 500; font-size: 10.5px; color: var(--ink-3); line-height: 1.2; letter-spacing: .5px; }
.brand b { display: block; line-height: 1.3; font-size: 16.5px; }
.nav { display: flex; gap: 6px; flex: 1; padding: 5px; border-radius: var(--pill); box-shadow: var(--in-sm); max-width: max-content; }
.nav a { color: var(--ink-2); padding: 7px 15px; border-radius: var(--pill); font-size: 14px; white-space: nowrap; transition: all var(--t) var(--flow); }
.nav a:hover { color: var(--ink); }
.nav a.active { background: var(--pill-active-bg); color: var(--pill-active-ink); box-shadow: var(--out-sm); }
.top-actions { display: flex; align-items: center; gap: 10px; margin-inline-start: auto; }
.bell { position: relative; background: var(--raised); border: 0; color: var(--ink-2); width: 42px; height: 42px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; box-shadow: var(--out-sm); transition: all var(--t) var(--flow); }
.bell:hover { color: var(--ink); transform: translateY(-1px); }
.bell:active { box-shadow: var(--in-sm); transform: none; }
.bell .dot { position: absolute; top: -2px; left: -2px; background: var(--sell); color: #fff; font-size: 10px; min-width: 19px; height: 19px; border-radius: 10px; display: grid; place-items: center; padding: 0 5px; box-shadow: 0 0 12px rgba(255,107,122,.7); animation: pop .4s var(--flow); }
.menu-btn { display: none; }
.ticker { direction: ltr; overflow: hidden; white-space: nowrap; font-size: 12.5px; color: var(--ink-2); border-top: 1px solid var(--line); mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); }
.ticker-track { display: inline-flex; gap: 38px; padding: 7px 0; animation: tick 48s linear infinite; }
.ticker-track > span { direction: rtl; unicode-bidi: isolate; }
.ticker:hover .ticker-track { animation-play-state: paused; }
.ticker .up { color: var(--buy); } .ticker .down { color: var(--sell); }
.nav .mobile-only { display: none; }

.demo-bar { max-width: 1240px; margin: 14px auto 0; width: calc(100% - 40px); background: var(--warn-soft); color: var(--warn); font-size: 13px; text-align: center; padding: 8px 14px; border-radius: var(--pill); }
.demo-bar select { margin-inline-start: 6px; padding: 3px 10px; border-radius: var(--pill); border: 0; background: var(--surface); box-shadow: var(--in-sm); color: var(--ink); }
.demo-bar button { background: none; border: 0; color: inherit; text-decoration: underline; cursor: pointer; padding: 0 4px; }

/* ---------- layout ---------- */
main { max-width: 1240px; margin: 0 auto; padding: 28px 20px 70px; min-height: 70vh; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.page-head h1 { margin: 0; font-size: 25px; font-weight: 800; letter-spacing: -.2px; }
.page-head p { margin: 4px 0 0; color: var(--ink-2); }
.card { background: var(--raised); border-radius: var(--radius); box-shadow: var(--out); transition: box-shadow var(--t) var(--flow), transform var(--t) var(--flow); position: relative; }
.card-pad { padding: 22px; }
.card h2, .card h3 { margin: 0 0 12px; font-size: 17px; }
.grid { display: grid; gap: 22px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.split { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.stack > * + * { margin-top: 14px; }
.section-title { font-size: 18px; font-weight: 800; margin: 0; }

/* ---------- hero ---------- */
.hero { border-radius: 34px; padding: 40px; display: grid; grid-template-columns: 1.1fr 1fr; gap: 34px; align-items: center; background: var(--raised); box-shadow: var(--out); position: relative; overflow: hidden; isolation: isolate; }
.hero::before { content: ''; position: absolute; width: 620px; height: 620px; left: 26%; top: -10%; z-index: -1; border-radius: 50%;
  background: conic-gradient(from 0deg, rgba(59,130,246,.0), rgba(59,130,246,.22), rgba(34,211,238,.16), rgba(139,124,246,.2), rgba(59,130,246,.0)); filter: blur(60px); animation: drift 22s linear infinite; }
.hero h1 { font-size: 34px; line-height: 1.5; margin: 12px 0 12px; font-weight: 800; }
.hero h1 .accent { background: linear-gradient(90deg, var(--blue-2), var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { color: var(--ink-2); margin: 0 0 24px; max-width: 560px; }
.live { display: inline-flex; align-items: center; gap: 10px; padding: 7px 16px 7px 12px; border-radius: var(--pill); box-shadow: var(--in-sm); font-size: 13px; color: var(--ink-2); }
.live i { width: 10px; height: 10px; border-radius: 50%; background: var(--buy); animation: pulse 2s infinite; }
.live b { color: var(--buy); }

/* Ring infographic (inspired by the reference app) */
.rings { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 18px; position: relative; }
.ring-big { width: 250px; height: 250px; position: relative; border-radius: 50%; background: var(--raised); box-shadow: var(--out); display: grid; place-items: center; }
.ring-big::after { content: ''; position: absolute; inset: 18px; border-radius: 50%; box-shadow: var(--in); pointer-events: none; }
.ring-big svg { position: absolute; inset: 0; transform: rotate(-90deg); filter: drop-shadow(0 0 10px rgba(59,130,246,.55)); }
.ring-big .halo { position: absolute; inset: -14px; border-radius: 50%; background: conic-gradient(from 210deg, transparent, rgba(59,130,246,.35), rgba(34,211,238,.25), transparent 60%); filter: blur(18px); z-index: -1; animation: spin 9s linear infinite; }
.ring-big .center { position: relative; z-index: 1; text-align: center; }
.ring-big .center b { display: block; font-size: 52px; font-weight: 800; line-height: 1.05; color: var(--ink); text-shadow: 0 0 22px rgba(96,165,250,.55); }
.ring-big .center em { display: block; font-style: normal; font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.ring-big .center span { font-size: 13px; color: var(--ink-2); }
.arc { animation: arc 1.6s var(--flow) both; }
.ring-list { display: flex; flex-direction: column; gap: 16px; }
.ring-item { display: flex; align-items: center; gap: 14px; position: relative; }
.ring-item .mini { width: 74px; height: 74px; position: relative; border-radius: 50%; background: var(--raised); box-shadow: var(--out-sm); display: grid; place-items: center; flex: none; }
.ring-item .mini svg { position: absolute; inset: -5px; width: 84px; height: 84px; transform: rotate(-90deg); }
.ring-item .mini b { font-size: 21px; font-weight: 800; position: relative; }
.ring-item .lbl { font-weight: 700; font-size: 15px; }
.ring-item .lbl small { display: block; font-weight: 400; color: var(--ink-3); font-size: 12px; }
.ring-item .node { width: 14px; height: 14px; border-radius: 50%; box-shadow: var(--out-sm), 0 0 12px currentColor; background: currentColor; flex: none; }

.book-mini { border-radius: var(--radius-md); box-shadow: var(--in); padding: 8px 6px; margin-top: 22px; }
.book-mini table { width: 100%; border-collapse: collapse; font-size: 14px; }
.book-mini th { color: var(--ink-3); font-weight: 500; text-align: start; padding: 6px 12px; font-size: 12px; }
.book-mini td { padding: 7px 12px; border-top: 1px solid var(--line); }
.book-mini .b { color: var(--buy); font-weight: 700; } .book-mini .s { color: var(--sell); font-weight: 700; }

/* ---------- buttons (pill, soft) ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 0; border-radius: var(--pill); padding: 10px 20px; font-weight: 700; cursor: pointer; background: var(--raised); color: var(--ink); box-shadow: var(--out-sm); white-space: nowrap; font-size: 14px; position: relative; overflow: hidden; isolation: isolate;
  transition: transform var(--t) var(--flow), box-shadow var(--t) var(--flow), color var(--t-fast), background var(--t); }
.btn::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 45%; pointer-events: none; background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent); transform: translateX(-120%) skewX(-18deg); }
.btn:hover { transform: translateY(-2px); }
.btn:hover::before { animation: sweep .9s var(--flow-soft); }
.btn:active { transform: translateY(0) scale(.98); box-shadow: var(--in-sm); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn-primary { background: linear-gradient(135deg, #4f8ff8, #2563eb); color: #fff; box-shadow: 0 10px 26px -8px rgba(37,99,235,.75), var(--out-sm); }
.btn-buy { background: linear-gradient(135deg, #3ee09a, #12a868); color: #06281a; box-shadow: 0 10px 26px -8px rgba(18,168,104,.7), var(--out-sm); }
.btn-sell { background: linear-gradient(135deg, #ff8592, #e5485c); color: #fff; box-shadow: 0 10px 26px -8px rgba(229,72,92,.7), var(--out-sm); }
.btn-ghost { background: transparent; box-shadow: none; color: var(--blue-2); }
.btn-ghost:hover { box-shadow: var(--out-sm); }
.btn-light { background: var(--pill-active-bg); color: var(--pill-active-ink); }
.btn-sm { padding: 6px 14px; font-size: 13px; }
.btn-lg { padding: 13px 26px; font-size: 15px; }
.btn-block { width: 100%; }

/* ---------- badges ---------- */
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 11px; border-radius: var(--pill); font-size: 12px; font-weight: 700; background: var(--chip-bg); color: var(--ink-2); box-shadow: var(--in-sm); white-space: nowrap; }
.badge.buy, .badge.ok { background: var(--buy-soft); color: var(--buy); box-shadow: none; }
.badge.sell, .badge.bad { background: var(--sell-soft); color: var(--sell); box-shadow: none; }
.badge.blue { background: var(--blue-soft); color: var(--blue-2); box-shadow: none; }
.badge.warn { background: var(--warn-soft); color: var(--warn); box-shadow: none; }
.verified { color: var(--blue-2); display: inline-flex; vertical-align: -3px; filter: drop-shadow(0 0 4px rgba(96,165,250,.6)); }
.asset-chip { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; }
.asset-ico { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 10.5px; font-weight: 800; background: var(--raised); color: var(--blue-2); box-shadow: var(--out-sm); direction: ltr; flex: none; letter-spacing: .3px; }
.asset-ico.metal-XAU { color: var(--gold); text-shadow: 0 0 8px rgba(242,193,78,.6); }
.asset-ico.metal-XAG { color: #c6cfdb; }

/* ---------- tables → soft rows ---------- */
.table-wrap { overflow-x: auto; padding: 4px 10px 10px; }
table.data { width: 100%; border-collapse: separate; border-spacing: 0 10px; font-size: 14px; }
table.data th { text-align: start; font-weight: 600; color: var(--ink-3); font-size: 12px; padding: 8px 16px 2px; white-space: nowrap; }
table.data td { padding: 13px 16px; vertical-align: middle; background: var(--surface); transition: background var(--t) var(--flow); }
table.data tbody tr { border-radius: var(--radius-md); box-shadow: var(--out-sm); transition: transform var(--t) var(--flow), box-shadow var(--t) var(--flow); }
table.data tbody td:first-child { border-start-start-radius: var(--radius-md); border-end-start-radius: var(--radius-md); }
table.data tbody td:last-child { border-start-end-radius: var(--radius-md); border-end-end-radius: var(--radius-md); }
table.data tr.clickable { cursor: pointer; }
table.data tr.clickable:hover { transform: translateY(-2px) scale(1.004); box-shadow: var(--out); }
.price { font-weight: 800; font-size: 15.5px; }
.empty { text-align: center; color: var(--ink-3); padding: 38px 16px; }
.empty svg { display: block; margin: 0 auto 10px; opacity: .45; }

/* ---------- forms (inset) ---------- */
.field { display: block; }
.field > span { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 7px; padding-inline-start: 6px; }
.input, select.input, textarea.input { width: 100%; border: 0; background: var(--surface); border-radius: var(--radius-sm); padding: 12px 16px; outline: none; box-shadow: var(--in-sm); transition: box-shadow var(--t) var(--flow); color: var(--ink); }
.input:focus { box-shadow: var(--in-sm), 0 0 0 2px rgba(59,130,246,.55), 0 0 18px rgba(59,130,246,.25); }
.input::placeholder { color: var(--ink-3); }
.input:disabled { opacity: .55; }
select.input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: 18px 52%, 13px 52%; background-size: 5px 5px; background-repeat: no-repeat; padding-left: 34px; }
textarea.input { min-height: 90px; resize: vertical; }
.seg { display: inline-flex; border-radius: var(--pill); padding: 5px; gap: 4px; box-shadow: var(--in-sm); }
.seg button { border: 0; background: transparent; padding: 7px 17px; border-radius: var(--pill); cursor: pointer; font-weight: 600; color: var(--ink-2); transition: all var(--t) var(--flow); }
.seg button.on { background: var(--pill-active-bg); color: var(--pill-active-ink); box-shadow: var(--out-sm); }
.side-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px; border-radius: var(--pill); box-shadow: var(--in-sm); }
.side-toggle button { padding: 13px; border-radius: var(--pill); border: 0; background: transparent; cursor: pointer; font-weight: 800; font-size: 15px; color: var(--ink-2); transition: all var(--t) var(--flow); }
.side-toggle button.on.sell { background: linear-gradient(135deg, #ff8592, #e5485c); color: #fff; box-shadow: 0 10px 24px -8px rgba(229,72,92,.8); }
.side-toggle button.on.buy { background: linear-gradient(135deg, #3ee09a, #12a868); color: #06281a; box-shadow: 0 10px 24px -8px rgba(18,168,104,.8); }
.total-box { border-radius: var(--radius-md); padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--in-sm); }
.total-box b { font-size: 21px; color: var(--blue-2); text-shadow: 0 0 14px rgba(96,165,250,.35); }
.filters { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; padding: 18px; }
.form-error { background: var(--sell-soft); color: var(--sell); padding: 11px 16px; border-radius: var(--radius-sm); font-size: 14px; animation: pop .3s var(--flow); }
.switch { appearance: none; width: 46px; height: 26px; border-radius: var(--pill); box-shadow: var(--in-sm); position: relative; cursor: pointer; flex: none; transition: background var(--t) var(--flow); margin: 0; }
.switch::after { content: ''; position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--raised); box-shadow: var(--out-sm); transition: transform var(--t) var(--flow), background var(--t); }
.switch:checked { background: rgba(59,130,246,.35); }
.switch:checked::after { transform: translateX(-20px); background: linear-gradient(135deg, #7fb2ff, #3b82f6); box-shadow: 0 0 12px rgba(59,130,246,.8); }

/* ---------- tabs (pill track) ---------- */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 6px; border-radius: var(--pill); box-shadow: var(--in-sm); margin-bottom: 22px; scrollbar-width: none; max-width: 100%; width: max-content; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { padding: 8px 16px; color: var(--ink-2); border-radius: var(--pill); white-space: nowrap; font-weight: 600; font-size: 14px; transition: all var(--t) var(--flow); }
.tabs a.on { background: var(--pill-active-bg); color: var(--pill-active-ink); box-shadow: var(--out-sm); }
.tabs .count { background: var(--blue-soft); color: var(--blue-2); border-radius: var(--pill); padding: 0 7px; font-size: 11px; margin-inline-start: 5px; }
.tabs .count.hot { background: var(--sell); color: #fff; box-shadow: 0 0 10px rgba(255,107,122,.6); }

/* ---------- stat tiles ---------- */
.tile { padding: 18px 20px; }
.tile span { color: var(--ink-3); font-size: 13px; }
.tile b { display: block; font-size: 27px; font-weight: 800; margin-top: 2px; }

/* ---------- progress (glowing groove) ---------- */
.progress { height: 10px; border-radius: var(--pill); box-shadow: var(--in-sm); overflow: hidden; padding: 2px; }
.progress > i { display: block; height: 100%; border-radius: var(--pill); background: linear-gradient(90deg, var(--cyan), var(--blue)); box-shadow: 0 0 12px rgba(59,130,246,.75); transform-origin: right; animation: grow 1.2s var(--flow) both; }
@keyframes grow { from { transform: scaleX(0); } }

/* ---------- rate cards ---------- */
.rate-card { padding: 18px 20px; cursor: pointer; }
.rate-card:hover { transform: translateY(-4px); }
.rate-card.on { box-shadow: var(--out), 0 0 0 2px rgba(59,130,246,.6), 0 18px 40px -16px rgba(59,130,246,.6); }
.rate-card .rates { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0 8px; }
.rate-card .rates div { border-radius: var(--radius-sm); padding: 8px 12px; box-shadow: var(--in-sm); }
.rate-card .rates span { font-size: 11.5px; color: var(--ink-3); display: block; }
.chg.up { color: var(--buy); } .chg.down { color: var(--sell); }
.spark path { stroke-dasharray: 600; animation: arc 1.6s var(--flow) both; --len: 600; }

/* ---------- requests ---------- */
.req { border-radius: var(--radius-md); padding: 16px 18px; background: var(--surface); box-shadow: var(--out-sm); position: relative; overflow: hidden; }
.req + .req { margin-top: 14px; }
.req::before { content: ''; position: absolute; top: 14px; bottom: 14px; right: 0; width: 4px; border-radius: 4px; background: var(--ink-3); }
.req.pending::before { background: var(--warn); box-shadow: 0 0 12px var(--warn); }
.req.accepted::before { background: var(--blue); box-shadow: 0 0 12px var(--blue); }
.req.completed::before { background: var(--buy); box-shadow: 0 0 12px var(--buy); }
.req.rejected, .req.cancelled { opacity: .6; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 18px; font-size: 14px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; font-weight: 600; }

/* ---------- chat ---------- */
.chat { display: flex; flex-direction: column; gap: 10px; max-height: 380px; overflow-y: auto; padding: 14px; border-radius: var(--radius-md); box-shadow: var(--in-sm); }
.bubble { max-width: 80%; padding: 9px 14px; border-radius: 18px; background: var(--raised); box-shadow: var(--out-sm); font-size: 14px; animation: pop .35s var(--flow); }
.bubble.mine { align-self: flex-start; background: linear-gradient(135deg, #4f8ff8, #2563eb); color: #fff; }
.bubble time { display: block; font-size: 11px; opacity: .7; }

/* ---------- timeline ---------- */
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { position: relative; padding: 0 28px 16px 0; font-size: 14px; color: var(--ink-3); }
.timeline li::before { content: ''; position: absolute; right: 2px; top: 6px; width: 14px; height: 14px; border-radius: 50%; box-shadow: var(--in-sm); }
.timeline li.done { color: var(--ink); }
.timeline li.done::before { background: var(--blue); box-shadow: 0 0 10px var(--blue); }
.timeline li::after { content: ''; position: absolute; right: 8px; top: 24px; bottom: 0; width: 2px; background: var(--line); }
.timeline li:last-child::after { display: none; }

/* ---------- notifications drawer ---------- */
.drawer { position: fixed; top: 74px; left: 20px; width: 380px; max-width: calc(100vw - 24px); max-height: 70vh; overflow-y: auto; z-index: 60; animation: rise .45s var(--flow); background: var(--glass) !important; backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); }
.notif { padding: 13px 18px; border-bottom: 1px solid var(--line); font-size: 14px; cursor: pointer; transition: background var(--t-fast); }
.notif:hover { background: rgba(127,127,127,.06); }
.notif.unread { position: relative; }
.notif.unread::after { content: ''; position: absolute; left: 16px; top: 20px; width: 8px; height: 8px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 8px var(--blue); }
.notif time { display: block; color: var(--ink-3); font-size: 12px; }

/* ---------- modal (glass) ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(8,10,16,.45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 80; display: grid; place-items: center; padding: 16px; animation: fade .3s var(--flow); }
.modal { width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; animation: rise .55s var(--flow); }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px 6px; }
.modal-head h3 { margin: 0; }
.x { background: var(--raised); border: 0; font-size: 20px; cursor: pointer; color: var(--ink-2); line-height: 1; width: 36px; height: 36px; border-radius: 50%; box-shadow: var(--out-sm); }
.x:active { box-shadow: var(--in-sm); }

.toast-wrap { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 99; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast { background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); color: var(--ink); padding: 11px 22px; border-radius: var(--pill); box-shadow: var(--out); font-size: 14px; animation: rise .5s var(--flow); border: 1px solid var(--line); }
.toast.err { color: var(--sell); }

.auth-wrap { max-width: 460px; margin: 20px auto; }
.footer { text-align: center; color: var(--ink-3); font-size: 12.5px; padding: 26px 20px 100px; }
.chart svg { width: 100%; height: auto; display: block; }
.notice { border-radius: var(--radius-sm); padding: 13px 18px; font-size: 14px; background: var(--blue-soft); color: var(--ink-2); }
.notice.warn { background: var(--warn-soft); color: var(--warn); }

/* ---------- mobile bottom navigation ---------- */
.bottom-nav { display: none; }

/* ---------- responsive ---------- */
@media (max-width: 1060px) {
  .hero { grid-template-columns: 1fr; padding: 30px 24px; }
  .split { grid-template-columns: 1fr; }
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .filters { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 900px) {
  .nav { display: none; }
  .bottom-nav { display: flex; position: fixed; bottom: 14px; left: 14px; right: 14px; z-index: 50; justify-content: space-around; padding: 8px; border-radius: 30px; background: var(--glass); backdrop-filter: blur(20px) saturate(1.3); -webkit-backdrop-filter: blur(20px) saturate(1.3); box-shadow: var(--out); border: 1px solid var(--line); padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
  .bottom-nav a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; border-radius: 22px; color: var(--ink-3); font-size: 11.5px; font-weight: 700; transition: all var(--t) var(--flow); }
  .bottom-nav a svg { width: 22px; height: 22px; transition: transform var(--t) var(--flow); }
  .bottom-nav a.active { background: var(--pill-active-bg); color: var(--pill-active-ink); box-shadow: var(--out-sm); }
  .bottom-nav a.active svg { transform: translateY(-1px) scale(1.08); }
}
@media (max-width: 640px) {
  main { padding: 18px 14px 110px; }
  .hero { padding: 24px 18px; border-radius: 28px; }
  .hero h1 { font-size: 24px; }
  .rings { grid-template-columns: 1fr; justify-items: center; }
  .ring-big { width: 210px; height: 210px; }
  .ring-list { flex-direction: row; justify-content: center; gap: 12px; }
  .ring-item { flex-direction: column; text-align: center; gap: 6px; }
  .ring-item .node { display: none; }
  .ring-item .mini { width: 64px; height: 64px; }
  .ring-item .mini svg { width: 74px; height: 74px; }
  .g2, .g3 { grid-template-columns: 1fr; }
  .g4 { gap: 14px; }
  .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 14px; }
  .page-head h1 { font-size: 21px; }
  .brand small { display: none; }
  .brand-mark { width: 40px; height: 40px; }
  .topbar-inner { gap: 10px; padding: 10px 14px; }
  .top-actions .btn-text, .top-actions .me-btn { display: none; }
  .demo-bar { width: calc(100% - 28px); border-radius: var(--radius-sm); }
  .card-pad { padding: 18px; }
  .grid { gap: 16px; }
  /* tables become soft cards */
  table.data.responsive thead { display: none; }
  table.data.responsive, table.data.responsive tbody, table.data.responsive tr, table.data.responsive td { display: block; width: 100%; }
  table.data.responsive { border-spacing: 0; }
  table.data.responsive tbody tr { margin-bottom: 14px; background: var(--surface); padding: 12px 16px; }
  table.data.responsive td { background: transparent; padding: 4px 0; display: flex; justify-content: space-between; gap: 12px; align-items: center; border-radius: 0 !important; }
  table.data.responsive td::before { content: attr(data-l); color: var(--ink-3); font-size: 12.5px; font-weight: 500; }
  table.data.responsive td.cell-main { padding-bottom: 8px; margin-bottom: 4px; border-bottom: 1px solid var(--line); }
  table.data.responsive td.cell-main::before, table.data.responsive td.cell-act::before { display: none; }
  table.data.responsive td.cell-act { justify-content: flex-start; padding-top: 10px; }
  .drawer { left: 12px; top: 66px; }
  .toast-wrap { bottom: 100px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
[data-theme="light"] .nav a, [data-theme="light"] .tabs a, [data-theme="light"] .bottom-nav a { color: var(--ink-2); }
[data-theme="light"] .nav a.active, [data-theme="light"] .tabs a.on, [data-theme="light"] .bottom-nav a.active { color: var(--pill-active-ink); }

/* ---------- official rate board ---------- */
.official { overflow: hidden; }
.official-head { display: flex; align-items: center; gap: 16px; padding: 22px 22px 8px; flex-wrap: wrap; }
.official-head h2 { margin: 0; font-size: 20px; }
.official-meta { text-align: left; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.seal { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--raised); box-shadow: var(--out-sm); color: var(--gold); filter: drop-shadow(0 0 8px rgba(242,193,78,.35)); }
.official-table td .price { font-size: 17px; }

/* ---------- step tracker ---------- */
.stepper { list-style: none; margin: 0; padding: 0; display: flex; gap: 0; position: relative; }
.stepper li { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; position: relative; font-size: 13px; color: var(--ink-3); }
.stepper li::before { content: ''; position: absolute; top: 17px; left: 50%; width: 100%; height: 3px; border-radius: 3px; box-shadow: var(--in-sm); z-index: 0; }
.stepper li:first-child::before { display: none; }
.stepper li.done::before, .stepper li.now::before { background: linear-gradient(270deg, var(--cyan), var(--blue)); box-shadow: 0 0 8px rgba(59,130,246,.6); }
.stepper .dot { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 14px; background: var(--raised); box-shadow: var(--out-sm); position: relative; z-index: 1; transition: all var(--t) var(--flow); }
.stepper li.done { color: var(--ink-2); }
.stepper li.done .dot { background: linear-gradient(135deg, #4f8ff8, #2563eb); color: #fff; }
.stepper li.now { color: var(--ink); font-weight: 700; }
.stepper li.now .dot { background: var(--raised); color: var(--blue-2); box-shadow: var(--out-sm), 0 0 0 3px rgba(59,130,246,.5), 0 0 18px rgba(59,130,246,.55); animation: pulseRing 2.2s var(--flow-soft) infinite; }
@keyframes pulseRing { 50% { box-shadow: var(--out-sm), 0 0 0 6px rgba(59,130,246,.18), 0 0 24px rgba(59,130,246,.6); } }
.stepper .lbl { max-width: 120px; line-height: 1.5; }
.step-note { margin-top: 18px; padding: 12px 16px; border-radius: var(--radius-sm); box-shadow: var(--in-sm); font-size: 14px; }
.stepper-plain { padding-top: 6px; }

/* ---------- action inbox ---------- */
.todo { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--line); font-size: 14px; }
.todo:last-child { border-bottom: 0; }
.todo-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 10px var(--warn); flex: none; }
.todo-dot.muted-dot { background: var(--ink-3); box-shadow: none; }

/* ---------- admin modules ---------- */
.modules { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
.module { display: flex; align-items: center; gap: 14px; padding: 18px; color: inherit !important; }
.module:hover { transform: translateY(-3px); }
.module-ico { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; box-shadow: var(--in-sm); color: var(--blue-2); flex: none; }
.module-txt { flex: 1; display: flex; flex-direction: column; }
.module-txt b { font-size: 15.5px; }
.module-txt small { color: var(--ink-3); font-size: 12.5px; line-height: 1.6; }
.count-badge { background: var(--sell); color: #fff; border-radius: var(--pill); min-width: 26px; height: 26px; display: grid; place-items: center; font-size: 12px; font-weight: 800; padding: 0 8px; box-shadow: 0 0 12px rgba(255,107,122,.6); }
.secret { font-size: 17px; letter-spacing: 2px; padding: 14px; border-radius: var(--radius-sm); box-shadow: var(--in-sm); text-align: center; word-break: break-all; }
.rules { margin: 0; padding-inline-start: 22px; display: flex; flex-direction: column; gap: 10px; }
.foot-links { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; margin-bottom: 10px; font-size: 13px; }

@media (max-width: 640px) {
  .stepper .lbl { font-size: 11px; max-width: 70px; }
  .stepper .dot { width: 30px; height: 30px; font-size: 12px; }
  .stepper li::before { top: 14px; }
  .official-meta { align-items: flex-start; text-align: right; width: 100%; }
  .modules { grid-template-columns: 1fr; }
}

/* =====================================================================
   Soft glass layer (v0.3): animated aura borders, looping light sweep,
   glass orbs, knob buttons, 3D switch, tip progress, fill numbers, chips
   ===================================================================== */
@property --ang { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
@property --p { syntax: '<percentage>'; inherits: false; initial-value: 0%; }
@keyframes angSpin { to { --ang: 360deg; } }
@keyframes sweepLoop { 0% { transform: translateX(-120%) skewX(-18deg); } 18%, 100% { transform: translateX(260%) skewX(-18deg); } }
@keyframes fillUp { from { --p: 0%; } }
@keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

/* Pastel light theme, frosted cards (inspired by the references) */
[data-theme="light"] body, [data-theme="light"] {
  --bg: #eef1f8;
  --raised: radial-gradient(120% 70% at 50% 125%, rgba(139,124,246,.16), transparent 60%), linear-gradient(160deg, rgba(255,255,255,.92), rgba(240,243,251,.82));
  --surface: rgba(255,255,255,.72);
  --chip-bg: rgba(255,255,255,.7);
}
[data-theme="light"] body {
  background-image: radial-gradient(800px 500px at 0% 0%, rgba(167,139,250,.22), transparent 60%), radial-gradient(700px 500px at 100% 10%, rgba(96,165,250,.22), transparent 60%), radial-gradient(700px 600px at 10% 100%, rgba(251,191,170,.22), transparent 60%), radial-gradient(600px 500px at 100% 100%, rgba(125,211,252,.2), transparent 60%);
}
[data-theme="light"] .card { backdrop-filter: blur(16px) saturate(1.2); -webkit-backdrop-filter: blur(16px) saturate(1.2); border: 1px solid rgba(255,255,255,.75); }

/* Animated aura: a slowly rotating light along the border */
.aura {
  border: 1.5px solid transparent !important;
  background: var(--raised) padding-box, conic-gradient(from var(--ang), transparent 0deg, rgba(59,130,246,.0) 40deg, #3b82f6 90deg, #22d3ee 130deg, #8b7cf6 170deg, transparent 220deg, transparent 360deg) border-box !important;
  animation: angSpin 7s linear infinite;
}
.aura.warm { background: var(--raised) padding-box, conic-gradient(from var(--ang), transparent 0deg, #ffb34d 80deg, #ff6b7a 140deg, transparent 210deg, transparent 360deg) border-box !important; }
[data-theme="light"] .aura { background: linear-gradient(160deg, rgba(255,255,255,.95), rgba(240,243,251,.9)) padding-box, conic-gradient(from var(--ang), rgba(255,255,255,.8) 0deg, #60a5fa 90deg, #a78bfa 160deg, rgba(255,255,255,.8) 230deg, rgba(255,255,255,.8) 360deg) border-box !important; }
.aura-round::before { content: ''; position: absolute; inset: -6px; border-radius: 50%; padding: 2px; background: conic-gradient(from var(--ang), transparent, #22d3ee, #3b82f6, #8b7cf6, transparent 55%); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: angSpin 5s linear infinite; z-index: 2; pointer-events: none; }

/* Looping light sweep on soft shapes (not only on hover) */
.sheen::before, .btn-primary::before, .btn-buy::before, .btn-sell::before, .btn-knob::after, .module::before { animation: sweepLoop 7s var(--flow-soft) infinite; }
.grid > .sheen:nth-child(2)::before { animation-delay: .9s; } .grid > .sheen:nth-child(3)::before { animation-delay: 1.8s; } .grid > .sheen:nth-child(4)::before { animation-delay: 2.7s; }
.modules > .module:nth-child(3n+2)::before { animation-delay: 1.2s; } .modules > .module:nth-child(3n)::before { animation-delay: 2.4s; }
.official::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 30%; pointer-events: none; z-index: 1; background: linear-gradient(90deg, transparent, rgba(255,255,255,.06), transparent); animation: sweepLoop 9s var(--flow-soft) infinite; }
[data-theme="light"] .official::before { background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent); }

/* Wallet-style blurred colour header on the official board */
.official-head { position: relative; isolation: isolate; }
.official-head::after { content: ''; position: absolute; inset: 8px 12px 0; border-radius: 22px; z-index: -1; background: radial-gradient(40% 90% at 85% 30%, rgba(96,165,250,.28), transparent 70%), radial-gradient(35% 80% at 40% 70%, rgba(167,139,250,.22), transparent 70%), radial-gradient(30% 70% at 10% 20%, rgba(34,211,238,.16), transparent 70%); filter: blur(10px); }

/* Glass orb (frosted circle) */
.glass-orb { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; flex: none; position: relative; border: 1px solid rgba(255,255,255,.55);
  background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.75), rgba(255,255,255,.18) 60%), rgba(255,255,255,.12);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 10px 24px -8px rgba(30,40,90,.45), inset 0 1px 1px rgba(255,255,255,.8); color: #fff; cursor: pointer; padding: 0; }
.glass-orb svg { filter: drop-shadow(0 1px 2px rgba(0,0,0,.25)); }

/* Knob button: glass orb overlapping a gradient pill */
.btn-knob { display: inline-flex; align-items: center; height: 54px; padding-inline-end: 26px; border-radius: var(--pill); color: #fff !important; font-weight: 800; font-size: 15px; gap: 14px; position: relative; overflow: hidden; isolation: isolate;
  background: linear-gradient(135deg, #3b82f6, #1d4ed8); box-shadow: 0 14px 30px -12px rgba(37,99,235,.8); transition: transform var(--t) var(--flow), box-shadow var(--t) var(--flow); }

/*

  const PROVINCES = ['کابل', 'هرات', 'بلخ', 'قندهار', 'ننگرهار', 'کندز', 'غزنی', 'بامیان', 'بدخشان', 'تخار', 'بغلان', 'پروان', 'لوگر', 'میدان وردک', 'پکتیا', 'خوست', 'هلمند', 'فراه', 'نیمروز', 'جوزجان', 'فاریاب', 'سمنگان', 'سرپل', 'بادغیس', 'غور', 'دایکندی', 'ارزگان', 'زابل', 'پکتیکا', 'کنر', 'لغمان', 'نورستان', 'کاپیسا', 'پنجشیر'];
  const RATE_GUARD = 0.15; // official rate changes larger than 15% need explicit confirmation

  /* ---------- value helpers ---------- */
  const round = (n, d = 6) => Math.round(Number(n) * 10 ** d) / 10 ** d;
  const toLatinDigits = (s) => String(s == null ? '' : s)
    .replace(/[۰-۹]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  const num = (v, label, { max = 1e13 } = {}) => {
    const n = Number(toLatinDigits(v).replace(/[,٬\s]/g, ''));
    if (!isFinite(n) || n <= 0) fail(`${label} باید عدد مثبت باشد.`);
    if (n > max) fail(`${label} بیش از حد مجاز است.`);
    return round(n);
  };
  const str = (v, label, { required = true, max = 200 } = {}) => {
    const s = (v == null ? '' : String(v)).replace(/[\u0000-\u001f\u007f]/g, ' ').trim();
    if (required && !s) fail(`${label} الزامی است.`);
    if (s.length > max) fail(`${label} بیش از حد طولانی است.`);
    return s;
  };
  const normPhone = (p) => toLatinDigits(p).replace(/[^\d+]/g, '').slice(0, 16);
  const displayName = (u) => (u ? (u.company || u.name) : '—');
  const fmtN = (n) => Number(n).toLocaleString('en-US', { maximumFractionDigits: 6 });

  // Tamper-evidence hash for the audit chain (not used for secrets).
  function chainHash(input) {
    let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (let i = 0; i < input.length; i++) {
      const ch = input.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);

  /* =========================================================
     Memory store (browser demo and tests)
     ========================================================= */
  function matchWhere(o, where) {
    for (const k of Object.keys(where || {})) {
      const c = where[k];
      if (k === '$or') { if (!c.some((w) => matchWhere(o, w))) return false; continue; }
      const v = o[k] === undefined ? null : o[k];
      if (c === null) { if (v !== null) return false; continue; }
      if (typeof c !== 'object') { if (v !== c) return false; continue; }
      if ('in' in c && !c.in.includes(v)) return false;
      if ('ne' in c && v === c.ne) return false;
      if ('lt' in c && !(v !== null && v < c.lt)) return false;
      if ('lte' in c && !(v !== null && v <= c.lte)) return false;
      if ('gt' in c && !(v !== null && v > c.gt)) return false;
      if ('gte' in c && !(v !== null && v >= c.gte)) return false;
      if ('like' in c && !String(v == null ? '' : v).includes(c.like)) return false;

    return true;
  }
  function sorter(order) {
    if (!order) return (a, b) => a.id - b.id;
    const desc = order.startsWith('-'), f = desc ? order.slice(1) : order;
    return (a, b) => {
      const x = a[f] == null ? -Infinity : a[f], y = b[f] == null ? -Infinity : b[f];

    };
  }
  function MemoryStore(data) {
    const d = data || { seq: {}, meta: {}, t: {} };
    const tbl = (k) => (d.t[k] = d.t[k] || {});
    const clone = (o) => (o == null ? null : JSON.parse(JSON.stringify(o)));

      kind: 'memory',
      get: (k, id) => clone(tbl(k)[id]),
      put(k, o) { if (o.id == null) o.id = this.nextId(k); tbl(k)[o.id] = clone(o); return o; },
      find(k, where, { order, limit, offset = 0 } = {}) {

      count: (k, where) => Object.values(tbl(k)).filter((o) => matchWhere(o, where)).length,
      one(k, where) { return this.find(k, where, { limit: 1 })[0] || null; },
      nextId: (k) => (d.seq[k] = (d.seq[k] || 0) + 1),
      meta(key, value) { if (value === undefined) return d.meta[key]; d.meta[key] = value; return value; },
      tx(fn) { const snap = JSON.stringify(d); try { return fn(); } catch (e) { const r = JSON.parse(snap); Object.keys(d).forEach((x) => delete d[x]); Object.assign(d, r); throw e; } },

     Shared internals
     ========================================================= */

  const assetOf = (S, id) => S.get('assets', Number(id));

  function sweep(S, ctx) {
